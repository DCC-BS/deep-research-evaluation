<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Research Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.1.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
<style>
/* Layout: header with set tabs + overview table; below, task list (left) and task detail with two comparison panes (right). */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --sunken: #eef1f0; --fg: #17201d; --muted: #5b6863; --line: #d5dcd8;
  --accent: #0d6a5a; --accent-soft: #dceee9;
  --good: #2c6e2a; --good-bg: #e0f0dc; --bad: #a3302a; --bad-bg: #f7e3e1; --warn: #7d5a00; --warn-bg: #f5ecd2;
  --c1: #0d6a5a; --c2: #8a4fbf; --c3: #b5651d; --c4: #2f6db0; --c5: #6b7a72;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-display: "Source Serif 4", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #192019; --sunken: #141a17; --fg: #e1e8e4; --muted: #98a59f; --line: #2c3631;
  --accent: #5cc4ae; --accent-soft: #1b332d;
  --good: #9fd396; --good-bg: #1e321f; --bad: #f0938b; --bad-bg: #3a1f1d; --warn: #e5c06a; --warn-bg: #352c15;
  --c1: #5cc4ae; --c2: #c39be8; --c3: #e3a15f; --c4: #79aee8; --c5: #a3b1aa; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #192019; --sunken: #141a17; --fg: #e1e8e4; --muted: #98a59f; --line: #2c3631;
  --accent: #5cc4ae; --accent-soft: #1b332d;
  --good: #9fd396; --good-bg: #1e321f; --bad: #f0938b; --bad-bg: #3a1f1d; --warn: #e5c06a; --warn-bg: #352c15;
  --c1: #5cc4ae; --c2: #c39be8; --c3: #e3a15f; --c4: #79aee8; --c5: #a3b1aa; color-scheme: dark }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.55 var(--f-body); }
header { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.hrow { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
h1 { font: 600 22px/1.2 var(--f-display); margin: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { font: 500 13px var(--f-body); color: var(--muted); background: none; border: 1px solid transparent; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tabs button:focus-visible, select:focus-visible, .task:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.hint { color: var(--muted); font-size: 12px; }
.overview { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13px; width: 100%; }
th { text-align: left; font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.main { display: grid; grid-template-columns: minmax(240px, 300px) 1fr; height: calc(100% - var(--header-h, 190px)); min-height: 400px; }
.list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--surface); }
.task { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.task[aria-current="true"] { background: var(--accent-soft); }
.task .tid { font: 500 12px var(--f-mono); color: var(--muted); }
.task .tp { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font: 500 11px var(--f-mono); padding: 1px 6px; border-radius: 3px; border-left: 3px solid var(--cc); background: var(--sunken); color: var(--fg); }
.chip.missing { color: var(--muted); }
.detail { overflow-y: auto; padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.prompt { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.prompt .meta { font: 12px var(--f-mono); color: var(--muted); margin-bottom: 6px; }
.prompt p { margin: 0; max-width: 100ch; }
.prompt ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.picker { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
select { font: 13px var(--f-body); padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); }
.panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.panes.single { grid-template-columns: 1fr; }
.pane { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--cc); border-radius: 6px; min-width: 0; display: flex; flex-direction: column; }
.pane-h { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.pane-h .name { font-weight: 600; }
.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px 12px; }
.m .k { font: 500 10.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.m .v { font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.m .v.good { color: var(--good); } .m .v.bad { color: var(--bad); }
.pane-body { padding: 14px 16px; overflow-x: auto; max-height: 75vh; overflow-y: auto; }
.report { max-width: 85ch; }
.report h1 { font-size: 20px; } .report h2 { font-size: 17px; } .report h3 { font-size: 15px; }
.report table { white-space: normal; } .report td, .report th { white-space: normal; border: 1px solid var(--line); }
.report a { color: var(--accent); word-break: break-all; }
.report pre { white-space: pre-wrap; }
.cit { padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.cit a { color: var(--accent); word-break: break-all; font-size: 13px; }
.cit ul { margin: 0; padding-left: 18px; font-size: 13px; }
.v-supported { color: var(--good); background: var(--good-bg); } .v-unsupported { color: var(--bad); background: var(--bad-bg); } .v-unknown { color: var(--muted); background: var(--sunken); }
.vb { font: 500 11px var(--f-mono); padding: 1px 6px; border-radius: 3px; margin-right: 4px; }
.bar { height: 8px; background: var(--sunken); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cc); }
.dims { display: grid; grid-template-columns: 160px 1fr 44px; gap: 6px 10px; align-items: center; font-size: 13px; }
.empty { color: var(--muted); padding: 20px 0; }
.err { color: var(--bad); white-space: pre-wrap; font: 12px var(--f-mono); }
ol.searches { margin: 0; padding-left: 22px; font-size: 13px; }
ol.searches li { padding: 2px 0; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; height: auto; }
  .list { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .panes { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header id="hdr">
  <div class="hrow">
    <h1>Deep Research Results</h1>
    <div class="tabs" role="tablist" id="setTabs"></div>
    <span class="hint" id="built"></span>
  </div>
  <div class="overview" id="overview"></div>
</header>
<div class="main">
  <nav class="list" id="taskList" aria-label="Tasks"></nav>
  <main class="detail" id="detail"></main>
</div>
<script>
const DATA = /*__DATA__*/null;
const SETS = {drb: "DeepResearch Bench (EN)", de: "German admin set"};
const REF = "reference (Gemini DR)";
const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];
const ORDER = ["gpt-researcher", "nvidia-dra", "baseline-agent", "baseline-nosearch", REF];
const cands = [...DATA.candidates].sort((a, b) => (ORDER.indexOf(a) + 99 * (ORDER.indexOf(a) < 0)) - (ORDER.indexOf(b) + 99 * (ORDER.indexOf(b) < 0)));
const color = c => COLORS[cands.indexOf(c) % COLORS.length];
const GATES = {race: 43, acc: 60, eff: 20, tokMed: 1e6, runtimeMin: 20};

let st = {set: "drb", id: null, a: "gpt-researcher", b: "nvidia-dra", tabA: "report", tabB: "report"};
try { Object.assign(st, JSON.parse(localStorage.getItem("drv") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("drv", JSON.stringify(st)); } catch (e) {} };

const cell = (c, set, id) => DATA.cells[`${c}|${set}|${id}`];
const tasksOf = set => DATA.tasks.filter(t => t.set === set);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[ch]));
const fmtTok = n => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n);
const median = xs => { const s = xs.filter(x => x != null).sort((a, b) => a - b); return s.length ? (s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2) : null; };
const mean = xs => { const s = xs.filter(x => x != null); return s.length ? s.reduce((a, b) => a + b, 0) / s.length : null; };
const cls = (ok) => ok == null ? "" : ok ? "good" : "bad";

function md(text) {
  if (window.marked && window.DOMPurify) {
    const html = DOMPurify.sanitize(marked.parse(text || ""));
    return html.replace(/<a /g, '<a target="_blank" rel="noopener noreferrer" ');
  }
  return `<pre>${esc(text)}</pre>`;
}

function renderTabs() {
  const el = document.getElementById("setTabs");
  el.innerHTML = Object.entries(SETS).map(([k, v]) =>
    `<button role="tab" aria-selected="${st.set === k}" data-set="${k}">${v}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { st.set = b.dataset.set; st.id = null; save(); render(); });
}

function aggregate(c, set) {
  const ts = tasksOf(set);
  const cs = ts.map(t => cell(c, set, t.id)).filter(Boolean);
  const reports = cs.filter(x => x.article).length;
  if (!reports) return null;
  const sup = cs.reduce((a, x) => a + (x.fact?.supported || 0), 0), chk = cs.reduce((a, x) => a + (x.fact?.checked || 0), 0);
  const factN = cs.filter(x => x.fact).length;
  return {
    reports, judged: cs.filter(x => x.race || x.rubric).length,
    race: mean(cs.map(x => x.race?.overall_score)),
    acc: chk ? 100 * sup / chk : null, eff: factN ? sup / factN : null,
    tok: median(cs.map(x => x.run?.total_tokens)), rt: median(cs.map(x => x.run?.runtime_s)),
    searches: median(cs.map(x => x.run?.searches)),
    errors: cs.filter(x => x.run?.status === "error").length,
    rubric: mean(cs.map(x => x.rubric?.pct)),
  };
}

function renderOverview() {
  const rows = cands.map(c => [c, aggregate(c, st.set)]).filter(([, a]) => a);
  const isDrb = st.set === "drb";
  const head = isDrb
    ? "<th>Approach</th><th>Reports</th><th>Judged</th><th>RACE</th><th>Cit. acc.</th><th>Eff. cit.</th><th>Tokens (median)</th><th>Runtime (median)</th><th>Searches</th><th>Errors</th>"
    : "<th>Approach</th><th>Reports</th><th>Judged</th><th>Rubric</th><th>Tokens (median)</th><th>Runtime (median)</th><th>Searches</th><th>Errors</th>";
  const body = rows.map(([c, a]) => {
    const name = `<td><span class="chip" style="--cc:${color(c)}">${esc(c)}</span></td>`;
    const common = `<td>${fmtTok(a.tok)}</td><td>${a.rt == null ? "–" : (a.rt / 60).toFixed(1) + " min"}</td><td>${a.searches ?? "–"}</td><td>${a.errors || ""}</td>`;
    return isDrb
      ? `<tr>${name}<td>${a.reports}</td><td>${a.judged}</td><td class="${c === REF ? "" : cls(a.race == null ? null : a.race >= GATES.race)}">${a.race == null ? "–" : a.race.toFixed(1)}</td><td>${a.acc == null ? "–" : a.acc.toFixed(1) + "%"}</td><td>${a.eff == null ? "–" : a.eff.toFixed(1)}</td>${common}</tr>`
      : `<tr>${name}<td>${a.reports}</td><td>${a.judged}</td><td>${a.rubric == null ? "–" : a.rubric.toFixed(1) + "%"}</td>${common}</tr>`;
  }).join("");
  document.getElementById("overview").innerHTML = rows.length
    ? `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`
    : `<p class="hint">No reports for this set yet.</p>`;
}

function chipFor(c, t) {
  const x = cell(c, t.set, t.id);
  if (!x || !x.article) return x?.run?.status === "error" ? `<span class="chip" style="--cc:${color(c)}" title="${esc(c)}: error">err</span>` : "";
  const v = t.set === "drb" ? x.race?.overall_score : x.rubric?.pct;
  return `<span class="chip ${v == null ? "missing" : ""}" style="--cc:${color(c)}" title="${esc(c)}">${v == null ? "•" : v.toFixed(0)}</span>`;
}

function renderList() {
  const ts = tasksOf(st.set);
  if (!st.id || !ts.find(t => t.id === st.id)) st.id = ts[0]?.id;
  const el = document.getElementById("taskList");
  el.innerHTML = ts.map(t => `<div class="task" tabindex="0" role="button" aria-current="${t.id === st.id}" data-id="${esc(t.id)}">
      <span class="tid">${esc(t.set.toUpperCase())} ${esc(t.id)}${t.category ? " · " + esc(t.category) : ""}</span>
      <span class="tp">${esc(t.prompt)}</span>
      <span class="chips">${cands.filter(c => c !== REF).map(c => chipFor(c, t)).join("")}</span></div>`).join("");
  el.querySelectorAll(".task").forEach(d => {
    const go = () => { st.id = d.dataset.id; save(); render(); };
    d.onclick = go; d.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });
}

function metric(k, v, c = "") { return `<div class="m"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`; }

function paneHtml(c, t, side) {
  const x = cell(c, t.set, t.id) || {};
  const tab = side === "a" ? st.tabA : st.tabB;
  const r = x.run || {}, f = x.fact, race = x.race, rub = x.rubric;
  let m = "";
  if (t.set === "drb") {
    m += metric("RACE", race ? race.overall_score.toFixed(1) : "–", race && c !== REF ? cls(race.overall_score >= GATES.race) : "");
    m += metric("Cit. acc.", f?.accuracy != null ? f.accuracy + "%" : "–", f?.accuracy != null ? cls(f.accuracy >= GATES.acc) : "");
    m += metric("Supported", f ? `${f.supported}/${f.checked}` : "–");
  } else {
    m += metric("Rubric", rub ? rub.pct + "%" : "–");
    m += metric("ß", rub ? rub.eszett : "–", rub ? cls(rub.eszett === 0) : "");
    m += metric("URLs", rub ? rub.cited_urls : "–");
  }
  if (c !== REF) {
    m += metric("Tokens", fmtTok(r.total_tokens), r.total_tokens ? cls(r.total_tokens <= GATES.tokMed) : "");
    m += metric("Runtime", r.runtime_s != null ? (r.runtime_s / 60).toFixed(1) + " min" : "–", r.runtime_s != null ? cls(r.runtime_s / 60 <= GATES.runtimeMin) : "");
    m += metric("LLM calls", r.llm_calls ?? "–");
    m += metric("Searches", r.searches ?? "–");
  }
  m += metric("Length", x.article ? Math.round(x.article.length / 1000) + "k chars" : "–");
  const tabs = [["report", "Report"], ["citations", "Citations"], ["searches", "Searches"], ["judge", "Judge"]]
    .filter(([k]) => c !== REF || k === "report");
  const opts = cands.map(o => `<option ${o === c ? "selected" : ""}>${esc(o)}</option>`).join("");
  return `<section class="pane" style="--cc:${color(c)}">
    <div class="pane-h">
      <label><span class="hint">${side.toUpperCase()} </span><select data-side="${side}" aria-label="Approach ${side.toUpperCase()}">${opts}</select></label>
      <div class="metrics">${m}</div>
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" data-side="${side}" data-tab="${k}">${l}</button>`).join("")}</div>
    </div>
    <div class="pane-body">${body(c, t, x, tab)}</div></section>`;
}

function body(c, t, x, tab) {
  if (x.run?.status === "error" && !x.article) return `<p class="err">${esc(x.run.error)}</p>`;
  if (!x.article && !x.run) return `<p class="empty">No result for this task yet.</p>`;
  if (tab === "report" || c === REF) return x.article ? `<div class="report">${md(x.article)}</div>` : `<p class="empty">No report.</p>`;
  if (tab === "citations") {
    if (!x.fact) return `<p class="empty">${t.set === "drb" ? "Not FACT-judged yet." : "FACT runs only on the DRB set."}</p>`;
    const order = v => v.includes("unsupported") ? 0 : v.includes("supported") ? 2 : 1;
    const cits = [...x.fact.citations].sort((a, b) => order(a.verdicts) - order(b.verdicts));
    return `<div class="legend"><span><span class="vb v-supported">supported</span>source backs the claim</span><span><span class="vb v-unsupported">unsupported</span>it doesn't</span><span><span class="vb v-unknown">unknown</span>page could not be fetched</span></div>` +
      cits.map(ci => `<div class="cit"><a href="${esc(ci.url)}" target="_blank" rel="noopener noreferrer">${esc(ci.url)}</a>
        <ul>${ci.facts.map((fa, i) => `<li><span class="vb v-${esc(ci.verdicts[i] || "unknown")}">${esc(ci.verdicts[i] || "–")}</span>${esc(fa)}</li>`).join("")}</ul></div>`).join("");
  }
  if (tab === "searches") {
    const s = x.searches || [];
    return s.length ? `<ol class="searches">${s.map(q => `<li>${esc(q.q)} <span class="hint">(${q.n} results${q.api === "tavily" ? ", tavily" : ""})</span></li>`).join("")}</ol>` : `<p class="empty">No searches logged.</p>`;
  }
  if (tab === "judge") {
    if (t.set === "drb") {
      if (!x.race) return `<p class="empty">Not RACE-judged yet.</p>`;
      const dims = [["comprehensiveness", "Comprehensiveness"], ["insight", "Insight / depth"], ["instruction_following", "Instruction following"], ["readability", "Readability"]];
      return `<p class="hint">RACE compares this report with the reference report; 50 means on par with it.</p><div class="dims">${dims.map(([k, l]) =>
        `<span>${l}</span><span class="bar"><i style="width:${Math.min(100, x.race[k] || 0)}%"></i></span><span class="hint">${(x.race[k] ?? 0).toFixed(1)}</span>`).join("")}</div>`;
    }
    if (!x.rubric) return `<p class="empty">Not rubric-judged yet.</p>`;
    const crit = [...DATA.rubric_common, ...(t.criteria || [])];
    const sc = x.rubric.verdict?.scores || [];
    return `<p>${esc(x.rubric.verdict?.summary || "")}</p><table><tbody>${sc.map(s => `<tr><td>${esc(s.score)}/3</td><td style="white-space:normal">${esc(crit[(s.criterion || 1) - 1] || "")}<br><span class="hint">${esc(s.reason)}</span></td></tr>`).join("")}</tbody></table>`;
  }
  return "";
}

function renderDetail() {
  const t = tasksOf(st.set).find(t => t.id === st.id);
  const el = document.getElementById("detail");
  if (!t) { el.innerHTML = `<p class="empty">No tasks.</p>`; return; }
  const crit = t.criteria ? `<ul>${t.criteria.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : "";
  el.innerHTML = `<div class="prompt"><div class="meta">${esc(t.set.toUpperCase())} ${esc(t.id)} · ${esc(t.language)} · depth ${esc(t.depth)} · sources ${esc((t.sources || []).join(", "))}</div><p>${esc(t.prompt)}</p>${crit}</div>
    <div class="panes ${st.a === st.b ? "single" : ""}">${paneHtml(st.a, t, "a")}${st.a === st.b ? "" : paneHtml(st.b, t, "b")}</div>`;
  el.querySelectorAll("select[data-side]").forEach(s => s.onchange = () => { st[s.dataset.side] = s.value; save(); renderDetail(); });
  el.querySelectorAll("button[data-tab]").forEach(b => b.onclick = () => { st[b.dataset.side === "a" ? "tabA" : "tabB"] = b.dataset.tab; save(); renderDetail(); });
}

function render() {
  renderTabs(); renderOverview(); renderList(); renderDetail();
  document.documentElement.style.setProperty("--header-h", document.getElementById("hdr").offsetHeight + "px");
}
document.getElementById("built").textContent = `${Object.keys(DATA.cells).length} results · pick two approaches to compare`;
if (!cands.includes(st.a)) st.a = cands[0];
if (!cands.includes(st.b)) st.b = cands[1] || cands[0];
render();
window.addEventListener("resize", () => document.documentElement.style.setProperty("--header-h", document.getElementById("hdr").offsetHeight + "px"));
