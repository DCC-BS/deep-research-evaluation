# research-agent presets (docs/research-agent-design.md). One preset = one research profile; in Open WebUI
# each preset becomes its own model ("Deep Research · Recht", ...). Only steering surface: no code per topic.

mcp_servers:
  opencaselaw: https://mcp.opencaselaw.ch/
  data-bs: https://mcp.data.bs.ch/mcp

budgets:
  # rounds: research rounds incl. follow-ups; max_subq: sub-questions in the plan;
  # queries_per_subq: web queries per sub-question and round; fetch_per_subq: pages read per sub-question and round;
  # max_follow_up: new sub-questions the reflection may add per round; max_tokens: hard stop for research.
  quick:    {rounds: 1, max_subq: 4, queries_per_subq: 2, fetch_per_subq: 3, max_follow_up: 0, max_tokens: 200000, words_per_part: 350, parts: [2, 3]}
  standard: {rounds: 2, max_subq: 8, queries_per_subq: 3, fetch_per_subq: 4, max_follow_up: 4, max_tokens: 450000, words_per_part: 800, parts: [4, 6]}
  deep:     {rounds: 3, max_subq: 10, queries_per_subq: 3, fetch_per_subq: 5, max_follow_up: 6, max_tokens: 900000, words_per_part: 1100, parts: [5, 8]}

defaults: &defaults
  avoid_domains: [facebook.com, instagram.com, tiktok.com, x.com, twitter.com, pinterest.com, linkedin.com,
                  apps.apple.com, play.google.com, quora.com, reddit.com, medium.com, scribd.com, coursehero.com]
  verify_entailment: true

presets:
  web_survey:
    <<: *defaults
    description: Broad research across the web (international topics, markets, technology, science).
    language: auto
    routes: {primary: [web], data: [web], secondary: [web]}
    prefer_domains:
      primary: []
      data: []
    query_rules: |
      Prefer authoritative sources: official statistics, regulators, peer-reviewed research, company filings,
      established research institutes. Use the language in which the best sources are published (often English).
    report:
      parts_hint: []
      analysis_part: "Analysis and assessment"
      closing_part: "Open questions and limitations"

  verwaltung_web:
    <<: *defaults
    description: Recherche zu Verwaltung, Strategien und Webangeboten von Bund, Kantonen und Städten.
    language: de
    routes: {primary: [web], data: [web], secondary: [web]}
    prefer_domains:
      primary: [bs.ch, admin.ch, ch.ch, grosserrat.bs.ch, zh.ch, be.ch, bl.ch, ge.ch, ti.ch, vd.ch, lu.ch, sg.ch, stadt-zuerich.ch, bern.ch, lugano.ch, egovernment.ch, ssk-cds.ch, kdk.ch]
      data: [statistik.bs.ch, data.bs.ch, bfs.admin.ch, opendata.swiss]
    query_rules: |
      Schweizer Verwaltungskontext. Verwende die offiziellen Bezeichnungen der jeweiligen Behörde.
      Für Kantone/Städte der Romandie französische, für das Tessin italienische Suchanfragen.
      Amtliche Primärquellen (Kanton, Stadt, Bund, Konferenzen) haben Vorrang vor Medien und Beratern.
    report:
      parts_hint: []
      words_per_part: 350          # administrative answers: concise, sourced throughout (German set analysis)
      analysis_part: null          # no separate synthesis part
      closing_part: "Offene Punkte und Grenzen der Recherche"
      writer_rules: "Kantonale Erlasse von Basel-Stadt tragen SG-Nummern, Bundeserlasse SR-Nummern."

  rechtsrecherche:
    <<: *defaults
    description: Rechtsrecherche Bund und Kanton Basel-Stadt (Erlasse, Rechtsprechung, Materialien).
    language: de
    routes: {primary: [mcp:opencaselaw, web], data: [web], secondary: [web]}
    mcp:
      opencaselaw: [search_laws, get_law, search_legislation, get_legislation, search_decisions, get_erwaegung, search, fetch]
    prefer_domains:
      primary: [gesetzessammlung.bs.ch, fedlex.admin.ch, lexfind.ch, bger.ch, dsb.bs.ch, edoeb.admin.ch, bs.ch]
      data: []
    query_rules: |
      Nenne Erlasse mit Kürzel und Nummer (Basel-Stadt: SG-Nummer, Bund: SR-Nummer), Urteile mit BGE- bzw.
      Dossiernummer. Kantonales und eidgenössisches Recht klar unterscheiden. Für Erlasse zuerst die
      opencaselaw-Werkzeuge verwenden, danach amtliche Webseiten (Merkblätter, Praxis der Verwaltung).
    report:
      parts_hint: [Rechtsgrundlagen, Praxis und Zuständigkeiten]
      words_per_part: 350
      analysis_part: null
      closing_part: "Offene Punkte und Grenzen der Recherche"
      writer_rules: "Kantonale Erlasse von Basel-Stadt tragen SG-Nummern (nicht SR), Bundeserlasse SR-Nummern; nenne Paragraph bzw. Artikel."

  grossrat:
    <<: *defaults
    description: Recherche in Geschäften, Vorstössen und Beschlüssen des Grossen Rates Basel-Stadt.
    language: de
    routes: {primary: [web, mcp:data-bs], data: [mcp:data-bs, web], secondary: [web]}
    mcp:
      data-bs: [get_datasets, get_dataset, get_records, get_facets]
    prefer_domains:
      primary: [grosserrat.bs.ch, bs.ch]
      data: [grosserrat.bs.ch, statistik.bs.ch]
    query_rules: |
      Suche nach Geschäften des Grossen Rates mit Stichworten zum Thema und den Vorstosstypen
      (Motion, Anzug, Interpellation, Budgetpostulat, Ratschlag); bekannte Geschäftsnummern in
      Anführungszeichen (z. B. "23.5544"). Medienberichte nur ergänzend.
    report:
      parts_hint: [Chronologie der Geschäfte, Beschlüsse und Stand]
      words_per_part: 350
      analysis_part: null
      closing_part: "Offene Punkte und Grenzen der Recherche"
      writer_rules: "Nenne jedes Geschäft mit Geschäftsnummer, Datum und Status."

  statistik:
    <<: *defaults
    description: Zahlen und Zeitreihen aus der amtlichen Statistik (Basel-Stadt, Bund).
    language: de
    routes: {primary: [mcp:data-bs, web], data: [mcp:data-bs], secondary: [web]}
    mcp:
      data-bs: [get_datasets, get_dataset, get_records, get_facets]
    prefer_domains:
      primary: [statistik.bs.ch, data.bs.ch, bfs.admin.ch]
      data: [data.bs.ch, statistik.bs.ch, bfs.admin.ch]
    query_rules: |
      Zahlen nur aus amtlichen Datensätzen oder Publikationen übernehmen, mit Datensatz-ID bzw. Tabelle,
      Stichtag und Einheit. Methodische Brüche und Definitionen ausweisen. Keine Zahlen schätzen.
    report:
      parts_hint: [Entwicklung in Zahlen, Erklärungen aus amtlichen Publikationen]
      words_per_part: 350
      analysis_part: null
      closing_part: "Methodische Hinweise, offene Punkte und Grenzen"
      writer_rules: "Zahlen nur mit Datensatz bzw. Tabelle, Stichtag und Einheit."
