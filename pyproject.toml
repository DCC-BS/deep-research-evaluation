[project]
name = "deep-research-evaluation"
version = "0.1.0"
description = "Benchmark harness for deep-research engines for Bebbi Bot"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "openai>=1.109",
    "pyyaml>=6.0",
    "python-dotenv>=1.1",
    # DeepResearch Bench (vendor/deep_research_bench) judge dependencies
    "requests>=2.32",
    "tqdm>=4.67",
    "pandas>=2.2",
    "numpy>=2.0",
    # research_agent
    "json-repair>=0.50",
    "rapidfuzz>=3.13",
    "fastapi>=0.142.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Supply-chain cooldown: only resolve releases older than 7 days.
exclude-newer = "P7D"
# TEMPORARY until 2026-10-29: security releases of certifi younger than 7 days. The weekly
# dependency routine removes these entries once the locked versions are 7 days old.
exclude-newer-package = { certifi = "P0D" }
package = false
